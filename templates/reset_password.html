<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - نظام أملاك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif !important; }
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; direction: rtl; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand h2 { color: #0284c7; font-weight: 800; font-size: 1.5rem; }
        .brand p { color: #64748b; font-size: 0.85rem; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; color: #334155; font-size: 0.85rem; margin-bottom: 8px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        .btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #059669; }
        .alert { padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
        .alert-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .links { text-align: center; margin-top: 15px; }
        .links a { color: #64748b; font-size: 0.85rem; text-decoration: none; font-weight: 600; }
        .links a:hover { color: #0284c7; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h2><i class="fas fa-key"></i> استعادة كلمة المرور</h2>
            <p>أدخل بريدك الإلكتروني وكلمة المرور الجديدة</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/reset-password" method="POST">
            <div class="form-group">
                <label>البريد الإلكتروني للآدمن</label>
                <input type="email" name="email" placeholder="admin@amlak.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور الجديدة</label>
                <input type="password" name="new_password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">تحديث كلمة المرور</button>
        </form>

        <div class="links">
            <a href="/login"><i class="fas fa-arrow-right"></i> العودة لتسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
